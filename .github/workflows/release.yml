name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
        with:
          fetch-depth: 0
          
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
        with:
          go-version: '1.26.0'
          
      - name: Set up Zig
        run: |
          ZIG_URL=$(curl -s https://ziglang.org/download/index.json | jq -r '.["0.16.0"]."x86_64-linux".tarball')
          cd /tmp
          wget $ZIG_URL -O zig.tar.xz
          tar xf zig.tar.xz
          DIR=$(ls -d zig-x86_64-linux-* | head -n 1)
          echo "/tmp/$DIR" >> $GITHUB_PATH
          
      - name: Download macOS SDK
        run: |
          cd /tmp
          wget https://github.com/joseluisq/macosx-sdks/releases/download/14.4/MacOSX14.4.sdk.tar.xz
          tar xf MacOSX14.4.sdk.tar.xz
          echo "MACOS_SDK_PATH=/tmp/MacOSX14.4.sdk" >> $GITHUB_ENV
          
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # sanad: ref=v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
