name: Ship txm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      ci_run_id: ${{ steps.readiness.outputs.ci_run_id }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release identity and reuse exact-commit CI
        id: readiness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/readiness"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/check-release.py --stable --tag "$GITHUB_REF_NAME"
            python3 scripts/check-release-ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
              --report "$RUNNER_TEMP/readiness/ci.json"
          else
            python3 scripts/check-release.py --stable
            python3 scripts/check-release-ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME" --manual --report "$RUNNER_TEMP/readiness/ci.json"
          fi
          ci_run_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["ci_run_id"])' < "$RUNNER_TEMP/readiness/ci.json")
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness/
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Reuse validated CI bundle
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact-source CI release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-release-bundle
          run-id: ${{ needs.preflight.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bundle
      - name: Download original CI validation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-release-evidence
          run-id: ${{ needs.preflight.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/evidence
      - name: Verify downloaded bundle against source and CI evidence
        run: |
          python3 scripts/check-release-artifacts.py --directory "$RUNNER_TEMP/bundle" --report "$RUNNER_TEMP/download-check.json"
          python3 - <<'PY_CHECK'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          original=json.loads((root/'evidence/bundle-check.json').read_text())
          current=json.loads((root/'download-check.json').read_text())
          assert original['passed'] and current['passed']
          assert {r['archive']:r['sha256'] for r in original['archives']} == {
              r['archive']:r['sha256'] for r in current['archives']}, 'CI bundle changed during download'
          PY_CHECK
      - name: Expose original validated bundle and privacy proof
        run: |
          python3 .github/scripts/annotate-bundle-report.py --bundle-check "$RUNNER_TEMP/evidence/bundle-check.json" \
            --privacy "$RUNNER_TEMP/evidence/archive-privacy.json" --commit "$GITHUB_SHA"
      - name: Retain immutable package inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle/*
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain bundle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-evidence
          overwrite: true
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/download-check.json
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      - name: Verify final bundle and create a stable draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py --stable --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/release-notes.md"
          python3 scripts/check-release-artifacts.py --directory "$RUNNER_TEMP/bundle"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/bundle/*.zip "$RUNNER_TEMP/bundle/checksums.txt" \
            --verify-tag --draft --title "txm $(cat VERSION)" --notes-file "$RUNNER_TEMP/release-notes.md"
