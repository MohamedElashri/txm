name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1

    - name: Check release metadata
      run: python3 scripts/check-release.py

    - uses: ./.github/actions/setup-build

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: make build

    - name: Run Tests
      run: make test

    - name: Guarded PTY and tmux integration
      run: make test-integration

    - name: Race tests
      run: make test-race

    - name: Native framing fuzz
      run: make test-fuzz

    - name: Native lifecycle with race detector
      run: make test-integration-race

  macos-integration:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1
    - uses: ./.github/actions/setup-build
    - name: Install tmux
      run: brew install tmux
    - name: Test and integrate on macOS
      run: make test test-race test-integration test-ssh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1

    - uses: ./.github/actions/setup-build

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # ref=v9.3.0
      with:
        version: v2.11.4
        args: --timeout=5m
      env:
        PKG_CONFIG_PATH: ${{ github.workspace }}/.ghostty-host/share/pkgconfig
        CGO_ENABLED: 1
