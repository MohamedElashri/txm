name: CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        description: Run the full suite when invoked by another workflow
        type: boolean
        default: true
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1
      with:
        fetch-depth: 0
    - name: Select CI scope
      id: scope
      env:
        FORCE_FULL_CI: ${{ inputs.force_full || false }}
      run: python3 scripts/check-ci-changes.py
    - name: Check release metadata
      run: python3 scripts/check-release.py
    - name: Test CI scope selection
      run: python3 -m unittest discover -s tests -p 'test_ci_changes.py' -v

  build-and-test:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1

    - uses: ./.github/actions/setup-build

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: make build

    - name: Run Tests
      run: make test

    - name: Guarded PTY and tmux integration
      run: make test-integration

    - name: Race tests
      run: make test-race

    - name: Native framing fuzz
      run: make test-fuzz

    - name: Native lifecycle with race detector
      run: make test-integration-race

  macos-integration:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1
    - uses: ./.github/actions/setup-build
    - name: Install tmux
      run: brew install tmux
    - name: Test and integrate on macOS
      run: |
        set -o pipefail
        go test -count=1 -v ./pkg/metrics 2>&1 | tee "$RUNNER_TEMP/macos-validation.log"
        make test test-race test-integration test-ssh 2>&1 | tee -a "$RUNNER_TEMP/macos-validation.log"
    - name: Surface bounded macOS failure details
      if: failure()
      shell: bash
      run: python3 .github/scripts/annotate-failure.py "$RUNNER_TEMP/macos-validation.log"

  lint:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ref=v7.0.1

    - uses: ./.github/actions/setup-build

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # ref=v9.3.0
      with:
        version: v2.11.4
        args: --timeout=5m
      env:
        PKG_CONFIG_PATH: ${{ github.workspace }}/.ghostty-host/share/pkgconfig
        CGO_ENABLED: 1
