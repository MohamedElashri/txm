name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
      with:
        go-version: '1.26.0'
        check-latest: true

    - name: Set up Zig
      run: |
        bash scripts/install-ci-zig.sh

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: |
        go clean -cache
        make build

    - name: Run Tests
      run: make test

    - name: Guarded PTY and tmux integration
      run: make test-integration

    - name: Race tests
      run: make test-race

    - name: Native framing fuzz
      run: make test-fuzz

    - name: Native lifecycle with race detector
      run: make test-integration-race

  macos-integration:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
      with:
        go-version: '1.26.0'
    - name: Set up Zig
      run: bash scripts/install-ci-zig.sh
    - name: Install tmux
      run: brew install tmux
    - name: Test and integrate on macOS
      run: make test test-integration

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
    
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # sanad: ref=v7.0.0
      with:
        go-version: '1.26.0'

    - name: Set up Zig
      run: |
        bash scripts/install-ci-zig.sh

    - name: Build dependencies
      run: make build-deps
        
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # sanad: ref=v9.3.0
      with:
        version: latest
        args: --timeout=5m
      env:
        PKG_CONFIG_PATH: ${{ github.workspace }}/.ghostty-host/share/pkgconfig
        CGO_ENABLED: 1
