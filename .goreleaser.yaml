version: 2

project_name: txm

before:
  hooks:
    - bash .github/scripts/build-ghostty.sh
    - bash scripts/generate-completions.sh

builds:
  - id: linux
    skip: '{{ eq (index .Env "TXM_RELEASE_PLATFORM") "darwin" }}'
    env: &unix_env
      - CGO_ENABLED=1
      - CC=zig cc -target {{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}x86_64-linux-gnu{{ else }}aarch64-linux-gnu{{ end }}{{ else if eq .Os "darwin" }}{{ if eq .Arch "amd64" }}x86_64-macos{{ else }}aarch64-macos{{ end }}{{ end }}{{ if eq .Os "darwin" }} --sysroot {{ .Env.MACOS_SDK_PATH }}{{ end }}
      - CXX=zig c++ -target {{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}x86_64-linux-gnu{{ else }}aarch64-linux-gnu{{ end }}{{ else if eq .Os "darwin" }}{{ if eq .Arch "amd64" }}x86_64-macos{{ else }}aarch64-macos{{ end }}{{ end }}{{ if eq .Os "darwin" }} --sysroot {{ .Env.MACOS_SDK_PATH }}{{ end }}
      - PKG_CONFIG_PATH={{ .Env.TXM_RELEASE_ROOT }}/.ghostty-release/{{ .Os }}-{{ .Arch }}/share/pkgconfig
      - CGO_LDFLAGS={{ if eq .Os "darwin" }}-L/usr/lib -F{{ .Env.MACOS_SDK_PATH }}/System/Library/Frameworks{{ end }}
      - CGO_LDFLAGS_ALLOW=.*
    goos:
      - linux
    goarch: &architectures
      - amd64
      - arm64
    ldflags: &version_flags
      - -s -w -X github.com/MohamedElashri/txm/pkg/cmd.Version={{.Version}}

  - id: darwin
    skip: '{{ eq (index .Env "TXM_RELEASE_PLATFORM") "linux" }}'
    env: *unix_env
    goos: [darwin]
    goarch: *architectures
    ldflags: *version_flags

  - id: windows
    skip: '{{ eq (index .Env "TXM_RELEASE_PLATFORM") "darwin" }}'
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/MohamedElashri/txm/pkg/cmd.Version={{.Version}}

  - id: musl
    skip: '{{ eq (index .Env "TXM_RELEASE_PLATFORM") "darwin" }}'
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target {{ if eq .Arch "amd64" }}x86_64-linux-musl{{ else }}aarch64-linux-musl{{ end }}
      - CXX=zig c++ -target {{ if eq .Arch "amd64" }}x86_64-linux-musl{{ else }}aarch64-linux-musl{{ end }}
      - PKG_CONFIG_PATH={{ .Env.TXM_RELEASE_ROOT }}/.ghostty-release/linux-musl-{{ .Arch }}/share/pkgconfig
      - CGO_LDFLAGS_ALLOW=.*
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -extldflags "-static" -X github.com/MohamedElashri/txm/pkg/cmd.Version={{.Version}}

universal_binaries:
  - id: darwin-universal
    ids: [darwin]
    replace: true
    name_template: txm

archives:
  - id: default
    ids:
      - linux
      - darwin-universal
      - windows
    formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/txm.1
      - completions/*
    name_template: '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "all" }}universal{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}'
  - id: musl
    ids:
      - musl
    formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/txm.1
      - completions/*
    name_template: '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}-musl'

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ if .Env.TXM_SNAPSHOT_VERSION }}{{ .Env.TXM_SNAPSHOT_VERSION }}{{ else }}{{ incpatch .Version }}-next{{ end }}'

changelog:
  disable: '{{ .IsSnapshot }}'
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: true
  prerelease: false
